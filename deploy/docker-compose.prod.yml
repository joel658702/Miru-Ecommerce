# Miru-Ecommerce · servicios de integración en el VPS
#
# Uso (desde la raíz del repo, en el servidor):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# La WebApp NO va aquí: vive en Vercel. Este stack recibe webhooks, los procesa
# y mantiene Redis para BullMQ.

services:
  redis:
    image: redis:8-alpine
    container_name: miru-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    container_name: miru-ingest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Solo localhost: el tráfico público entra por el proxy (Traefik/Caddy).
      - "127.0.0.1:3001:3001"
    networks:
      - default
      - coolify
    labels:
      # Publicación con el Traefik de Coolify (este VPS).
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.miru-ingest.rule=Host(`api.miruecommerce.pro`)"
      - "traefik.http.routers.miru-ingest.entrypoints=https"
      - "traefik.http.routers.miru-ingest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.miru-ingest.service=miru-ingest"
      - "traefik.http.services.miru-ingest.loadbalancer.server.port=3001"
      - "traefik.http.routers.miru-ingest-http.rule=Host(`api.miruecommerce.pro`)"
      - "traefik.http.routers.miru-ingest-http.entrypoints=http"
      - "traefik.http.routers.miru-ingest-http.middlewares=miru-ingest-https"
      - "traefik.http.middlewares.miru-ingest-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.miru-ingest-https.redirectscheme.permanent=true"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: miru-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: miru-caddy
    restart: unless-stopped
    # Solo para un VPS "limpio". Si el servidor ya tiene Traefik/Coolify en
    # 80/443, NO activar este perfil: se publica con el proxy existente.
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ingest

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # Red de datos del stack (redis, ingest, worker).
  default:
  # Red compartida con el proxy de Coolify; solo se usa si existe.
  coolify:
    external: true
